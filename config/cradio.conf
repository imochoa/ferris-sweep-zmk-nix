# https://zmk.dev/docs/config/system#kconfig
# https://zmk.dev/docs/config#kconfig-value-types
# https://docs.zephyrproject.org/3.5.0/build/kconfig/index.html

# PARAM = changed # (default)

# Some config is set here:
# https://github.com/zmkfirmware/zmk/tree/9aaf87c6d2947544932366b98a9966049b4a9794/app/boards/shields/cradio

# [ZMK Studio](https://zmk.dev/docs/config/zmk-studio)
# CONFIG_ZMK_STUDIO_LOCKING=n # (y)

# [Mouse]
# CONFIG_ZMK_MOUSE???
CONFIG_ZMK_POINTING=y

CONFIG_ZMK_KEYBOARD_NAME="RCradio"

# don't use this!
# CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=y

# [Battery](https://zmk.dev/docs/config/battery)
# Required for split keyboards
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# [Bluetooth](https://zmk.dev/docs/config/bluetooth)
# Enable BLE explicitly: on ZMK main the HWMv2 `nice_nano` board defconfig no
# longer sets CONFIG_ZMK_BLE=y (the old nice_nano_v2 board did), so without
# this the keyboard builds USB-only and won't advertise over Bluetooth.
CONFIG_ZMK_BLE=y

# Non-volatile storage for BLE bonds. The HWMv2 `nice_nano` board defconfig
# (unlike the old nice_nano_v2) does NOT enable the flash/NVS/settings backend,
# so CONFIG_BT_SETTINGS has nowhere to persist and the keyboard forgets its
# pairing on every power cycle. Enable the storage stack explicitly.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y

# Let a re-pair OVERWRITE an existing bond instead of rejecting it. Without this,
# a stale bond (on the keyboard or the host) makes re-pairing fail with the
# host reporting "incorrect PIN/passphrase". The keyboard uses Just Works
# pairing, so allowing unauthenticated overwrite is the pragmatic default.
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
# ...but ALLOW_UNAUTH_OVERWRITE `imply`s ZMK_BLE_PASSKEY_ENTRY, which makes the
# host prompt for a PIN. Force it off so pairing stays Just Works (no PIN).
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

# Bluetooth splits https://zmk.dev/docs/config/split#bluetooth-splits
# CONFIG_ZMK_SPLIT_BLE=y

# Future defaults
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
# CONFIG_ZMK_BLE_EXPERIMENTAL_SEC=y

# https://zmk.dev/docs/troubleshooting/connection-issues#issues-while-connected
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y


# Set sleep timeout to 
CONFIG_ZMK_SLEEP=y # (n)
# (10min 900000=15*60*1000ms)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
