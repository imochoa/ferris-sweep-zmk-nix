# settings_reset overrides for the HWMv2 `nice_nano` board.
#
# The built-in settings_reset shield only sets CONFIG_SETTINGS +
# CONFIG_ZMK_SETTINGS_RESET_ON_START and relies on the BOARD to provide the
# flash/NVS backend. The old nice_nano_v2 board did; the new HWMv2 `nice_nano`
# board does NOT — so without these the reset image has no storage to erase and
# flashing it does NOTHING (host + split bonds survive). Enable the storage
# stack so the reset actually clears the settings partition.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
